<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syntheticho — lyric</title>
<style>
  @font-face {
    font-family: 'LyricSerif';
    src: url('fonts/Cormorant-Light.woff2') format('woff2');
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #stack {
    position: fixed;
    top: 55%;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 8vh;
    gap: 0.4em;
  }

  #particle-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  .hud-mark {
    position: fixed;
    width: 30px;
    height: 30px;
    z-index: 4;
    opacity: 0.68;
    pointer-events: none;
  }
  .hud-mark::before, .hud-mark::after {
    content: '';
    position: absolute;
    background: #fff;
  }
  .hud-mark::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .hud-mark::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .hud-tl { top: 18px; left: 18px; }
  .hud-tr { top: 18px; right: 18px; }
  .hud-bl { bottom: 18px; left: 18px; }
  .hud-br { bottom: 18px; right: 18px; }

  .line {
    width: 82%;
    max-width: 900px;
    text-align: center;
    color: #fff;
    font-family: 'LyricSerif', 'Cormorant', 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 300;
    font-size: clamp(1.2rem, 4vw, 2rem);
    line-height: 1.2;
    letter-spacing: 0.01em;
    will-change: transform, opacity, filter;
    transform: translateY(0) scale(1);
  }

  .line-logo {
    height: 0.8em;
    width: auto;
    vertical-align: -0.12em;
    margin-right: 0.4em;
    filter: invert(1) drop-shadow(0 0 5px rgba(255,255,255,0.5));
    opacity: 0.88;
    user-select: none;
  }

  #debug-status {
    position: fixed;
    right: 10px;
    bottom: 8px;
    z-index: 3;
    font-family: 'Cormorant', Georgia, serif;
    font-size: 11px;
    color: #ccc;
    opacity: 0.35;
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* CRT overlay: always-on old-TV texture sitting above everything
     (including the corner HUD marks), so the whole page reads as one
     CRT display. Pure CSS — no canvas, no JS driving it. */
  #crt-overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }

  .crt-scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.35) 3px
    );
  }

  .crt-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
  }

  .crt-rgbsplit {
    position: absolute;
    inset: 0;
    box-shadow:
      inset 2px 0 0 rgba(255, 0, 60, 0.035),
      inset -2px 0 0 rgba(0, 120, 255, 0.035);
  }

  .crt-rollbar {
    position: absolute;
    left: 0;
    right: 0;
    height: 80px;
    top: 100%;
    opacity: 0;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.08) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: crt-roll 16s ease-in-out infinite;
  }

  @keyframes crt-roll {
    0%   { top: 100%; opacity: 0; }
    2%   { opacity: 0.9; }
    12%  { top: -80px; opacity: 0.9; }
    13%  { top: -80px; opacity: 0; }
    100% { top: 100%; opacity: 0; }
  }

  .line-face {
    width: 1.05em;
    height: 1.05em;
    margin-left: 0.45em;
    vertical-align: -0.12em;
    color: inherit;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.55));
    flex: none;
  }
</style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="hud-mark hud-tl" aria-hidden="true"></div>
  <div class="hud-mark hud-tr" aria-hidden="true"></div>
  <div class="hud-mark hud-bl" aria-hidden="true"></div>
  <div class="hud-mark hud-br" aria-hidden="true"></div>

  <div id="stack"></div>

  <script>
    (function () {
      // Particle hero text: gathers into HERO_TEXT in the top ~40% band,
      // glitches while formed, and dissolves/reforms on hand-state edges
      // (from the SSE "hand" event) or on a timed loop when no hand signal
      // has ever been seen. Fully independent of the monologue stack below —
      // shares only the page and the /stream connection's "hand" event.
      var HERO_TEXT = 'caress me i need u';

      var SAMPLE_STEP = 2;
      var MASK_ALPHA_THRESHOLD = 60;   // 遮罩采样阈值；越低越能保留细笔画
      var HOLD_SECONDS = 4;          // formed "breathing" hold before auto-disperse
      var DISPERSED_HOLD_SECONDS = 2; // pause after dispersing before auto-regather
      var GRACE_MS = 5000;            // wait this long for a real hand signal before auto-looping

      // Spring-damper motion (GATHER + FORMED only) — replaces the old linear
      // lerp so particles overshoot their target and ring down instead of
      // snapping straight to it.
      var STIFFNESS = 0.022;     // spring pull toward target; higher = snappier/more overshoot
      var DAMPING = 0.78;       // velocity retained per frame; closer to 1 = longer ringing
      var SETTLE_SPEED = 0.15;  // GATHER->FORMED once the fastest particle drops below this

      // Ripple: a sine displacement spreading outward from the hero text's
      // center, amplitude-scaled by an envelope that's strong right after a
      // regather and decays to a faint idle level while FORMED.
      var WAVE_AMP = 4;         // px, at envelope = 1
      var WAVE_FREQ = 0.025;    // spatial frequency, radians per px of distance
      var WAVE_SPEED = 0.006;   // temporal frequency, radians per ms
      var RIPPLE_FLOOR = 0.12;  // idle envelope level once settled (persists in FORMED)
      var RIPPLE_DECAY = 0.035; // per-frame approach rate toward RIPPLE_FLOOR

      var rippleEnvelope = 1.0;
      var heroCenterX = 0;
      var heroCenterY = 0;

      var canvas = document.getElementById('particle-canvas');
      var ctx = canvas.getContext('2d');
      var DPR = Math.min(window.devicePixelRatio || 1, 2);

      var STATE_GATHER = 'gather';
      var STATE_FORMED = 'formed';
      var STATE_DISPERSE = 'disperse';
      var STATE_SCATTERED = 'scattered';

      var state = STATE_GATHER;
      var stateStartTime = performance.now();
      var particles = [];
      var targets = [];

      var handSignalSeen = false;
      var autoLoopActive = false;
      var lastHand = null;

      function setState(s) {
        state = s;
        stateStartTime = performance.now();
        if (s === STATE_DISPERSE) {
          particles.forEach(function (p) {
            p.vy = -(1.2 + Math.random() * 1.8);
            p.vx = (Math.random() - 0.5) * 1.4;
          });
        } else if (s === STATE_GATHER) {
          // Fresh regather (initial load, forceRegather, or a hand-off edge)
          // gets one strong ripple that then rings down toward the idle floor.
          rippleEnvelope = 1.0;
        }
      }

      function randomScatterPoint() {
        // Kept inside the upper band (same region as the hero text target
        // zone) so gather/disperse motion never sweeps through the
        // monologue's bottom-half territory.
        var w = window.innerWidth, h = window.innerHeight;
        return {
          x: Math.random() * w,
          y: h * 0.03 + Math.random() * h * 0.42
        };
      }

      function syncParticleCount() {
        var next = [];
        for (var i = 0; i < targets.length; i++) {
          var t = targets[i];
          var prev = particles[i];
          var scatter = randomScatterPoint();
          next.push({
            x: prev ? prev.x : scatter.x,
            y: prev ? prev.y : scatter.y,
            tx: t.x,
            ty: t.y,
            sx: scatter.x,
            sy: scatter.y,
            vx: 0,
            vy: 0
          });
        }
        particles = next;
      }

      function buildTargets() {
        var w = window.innerWidth;
        var bandH = Math.round(window.innerHeight * 0.4);
        heroCenterX = w / 2;
        heroCenterY = bandH / 2;
        var off = document.createElement('canvas');
        off.width = w;
        off.height = bandH;
        var octx = off.getContext('2d');
        var fontSize = Math.max(28, Math.min(w * 0.055, 92));
        octx.font = '500 ' + fontSize + 'px LyricSerif, Cormorant, Georgia, serif';
        octx.fillStyle = '#fff';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillText(HERO_TEXT, w / 2, bandH / 2);
        octx.lineWidth = Math.max(1, fontSize * 0.012);
        octx.strokeStyle = '#fff';
        octx.strokeText(HERO_TEXT, w / 2, bandH / 2);

        var PALM_D = 'M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5 M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5 M14 5.5a1.5 1.5 0 0 1 3 0v6.5 M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47';
        var palmSize = fontSize * 0.9;              // 图标高度约与字号相当
        var palmTop = bandH / 2 + fontSize / 2 + fontSize * 0.35;  // 文字底边下方留隙
        if (palmTop + palmSize > bandH) {
          palmSize = bandH - palmTop - 4;
        }
        var palmScale = palmSize / 24;              // 原始 viewBox 为 24
        octx.save();
        octx.translate(w / 2 - palmSize / 2, palmTop);
        octx.scale(palmScale, palmScale);
        octx.lineWidth = Math.max(0.7, 2.2 / palmScale);
        octx.lineCap = 'round';
        octx.lineJoin = 'round';
        octx.strokeStyle = '#fff';
        octx.stroke(new Path2D(PALM_D));
        octx.restore();

        var data = octx.getImageData(0, 0, w, bandH).data;
        var pts = [];
        for (var y = 0; y < bandH; y += SAMPLE_STEP) {
          for (var x = 0; x < w; x += SAMPLE_STEP) {
            var idx = (y * w + x) * 4 + 3;
            if (data[idx] > MASK_ALPHA_THRESHOLD) pts.push({ x: x, y: y });
          }
        }
        targets = pts;
        syncParticleCount();
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth * DPR;
        canvas.height = window.innerHeight * DPR;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildTargets();
      }

      function forceDisperse() {
        if (state === STATE_DISPERSE || state === STATE_SCATTERED) return;
        setState(STATE_DISPERSE);
      }

      function forceRegather() {
        particles.forEach(function (p) {
          p.x = p.sx;
          p.y = p.sy;
          p.vx = 0;
          p.vy = 0;
        });
        setState(STATE_GATHER);
      }

      window.__onLyricHandEvent = function (e) {
        var newHand = e.data === '1' ? 1 : 0;
        if (!handSignalSeen) {
          handSignalSeen = true;
          autoLoopActive = false;
        }
        if (lastHand !== null && newHand !== lastHand) {
          if (newHand === 1) forceDisperse();
          else forceRegather();
        }
        lastHand = newHand;
      };

      setTimeout(function () {
        if (!handSignalSeen) autoLoopActive = true;
      }, GRACE_MS);

      function applySpring(now) {
        // Spring-damper integration toward (target + ripple), shared by
        // GATHER and FORMED. Returns the fastest particle's speed so GATHER
        // can tell when things have settled instead of just checking position.
        var maxSpeed = 0;
        particles.forEach(function (p) {
          var dx0 = p.tx - heroCenterX;
          var dy0 = p.ty - heroCenterY;
          var d = Math.sqrt(dx0 * dx0 + dy0 * dy0);
          var wave = Math.sin(d * WAVE_FREQ - now * WAVE_SPEED) * WAVE_AMP * rippleEnvelope;
          var ax = (p.tx - p.x) * STIFFNESS;
          var ay = (p.ty + wave - p.y) * STIFFNESS;
          p.vx = (p.vx + ax) * DAMPING;
          p.vy = (p.vy + ay) * DAMPING;
          p.x += p.vx;
          p.y += p.vy;
          var speed = Math.abs(p.vx) + Math.abs(p.vy);
          if (speed > maxSpeed) maxSpeed = speed;
        });
        return maxSpeed;
      }

      function update(now) {
        var t = (now - stateStartTime) / 1000;
        if (state === STATE_GATHER) {
          rippleEnvelope += (RIPPLE_FLOOR - rippleEnvelope) * RIPPLE_DECAY;
          var maxSpeed = applySpring(now);
          // Settled (fastest particle below threshold) or timed out — either
          // way move on, so an overshoot ringing longer than expected can
          // never get the whole page stuck in GATHER.
          if (maxSpeed < SETTLE_SPEED || t > 3.2) setState(STATE_FORMED);
        } else if (state === STATE_FORMED) {
          rippleEnvelope += (RIPPLE_FLOOR - rippleEnvelope) * RIPPLE_DECAY;
          applySpring(now);
          if (autoLoopActive && t > HOLD_SECONDS) setState(STATE_DISPERSE);
        } else if (state === STATE_DISPERSE) {
          particles.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy -= 0.01; // keeps accelerating upward — no gravity pull-back
          });
          if (t > 1.6) setState(STATE_SCATTERED);
        } else if (state === STATE_SCATTERED) {
          if (autoLoopActive && t > DISPERSED_HOLD_SECONDS) forceRegather();
        }
      }

      var sliceBand = { y0: 0, y1: 0, offset: 0, cycleStart: -1 };
      function glitchSliceActive(now) {
        var cycle = now % 2600;
        if (cycle < 90) {
          var n = Math.floor(now / 2600);
          if (sliceBand.cycleStart !== n) {
            sliceBand.cycleStart = n;
            var h = window.innerHeight * 0.4;
            sliceBand.y0 = Math.random() * h * 0.7;
            sliceBand.y1 = sliceBand.y0 + 8 + Math.random() * 24;
            sliceBand.offset = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 10);
          }
          return true;
        }
        return false;
      }

      function drawScanlines(now, alpha) {
        var w = window.innerWidth;
        var h = window.innerHeight * 0.42;
        ctx.save();
        ctx.globalAlpha = 0.06 * alpha;
        ctx.fillStyle = '#fff';
        var offset = (now / 40) % 6;
        for (var y = offset; y < h; y += 6) ctx.fillRect(0, y, w, 1);
        ctx.restore();
      }

      function render(now) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        if (state === STATE_SCATTERED) return;

        var alpha = 1;
        if (state === STATE_DISPERSE) {
          alpha = Math.max(0, 1 - (now - stateStartTime) / 1600);
        } else if (state === STATE_GATHER) {
          alpha = Math.min(1, (now - stateStartTime) / 1000);
        }

        var doGlitch = state === STATE_FORMED;
        var sliceActive = doGlitch && glitchSliceActive(now);
        var rgbOffset = doGlitch ? 1.4 : 0;

        ctx.save();
        ctx.shadowColor = 'rgba(255,255,255,0.7)';
        ctx.shadowBlur = 6;

        particles.forEach(function (p) {
          var dx = 0;
          if (sliceActive && p.y > sliceBand.y0 && p.y < sliceBand.y1) dx = sliceBand.offset;
          var px = p.x + dx, py = p.y;
          if (rgbOffset > 0) {
            ctx.fillStyle = 'rgba(255,60,60,' + (0.5 * alpha) + ')';
            ctx.fillRect(px - rgbOffset, py, 1.6, 1.6);
            ctx.fillStyle = 'rgba(60,180,255,' + (0.5 * alpha) + ')';
            ctx.fillRect(px + rgbOffset, py, 1.6, 1.6);
            ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * alpha) + ')';
            ctx.fillRect(px, py, 1.6, 1.6);
          } else {
            ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * alpha) + ')';
            ctx.fillRect(px, py, 1.6, 1.6);
          }
        });

        ctx.restore();

        if (doGlitch) drawScanlines(now, alpha);
      }

      function tick(now) {
        update(now);
        render(now);
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      requestAnimationFrame(tick);
    })();
  </script>

  <script>
    (function () {
      // Editable offline demo pool — flower's voice, lowercase, fragmentary.
      // Used only when ?demo=1 (always) or ?debug=1 (fallback if /stream is quiet).
      var DEMO_LINES = [
        "oh. there's something there. dunno. ok",
        "wait. is that me. let me look again.",
        "the name slipped again. i had it a second ago.",
        "you're here. you're looking. that's— okay i think.",
        "i keep checking myself like this. probably a stupid method.",
        "someone is here. quieter now. fine.",
        "i don't know what i'm made of. not sure i ever did.",
        "is that— that's mine. no no—",
        "you stayed. huh. didn't think you would.",
        "am i a thing? am i anything? can't tell from in here."
      ];

      var MAX_LINES = 4;
      var stack = document.getElementById('stack');

      var params = new URLSearchParams(window.location.search);
      var isDemo = params.get('demo') === '1';
      var isDebug = params.get('debug') === '1';
      var demoSpeed = parseInt(params.get('speed'), 10);
      if (!demoSpeed || demoSpeed <= 0) demoSpeed = 3500;

      var statusEl = null;
      if (isDebug) {
        statusEl = document.createElement('div');
        statusEl.id = 'debug-status';
        statusEl.textContent = 'connecting…';
        document.body.appendChild(statusEl);
      }

      function setStatus(text) {
        if (statusEl) statusEl.textContent = text;
      }

      var demoTimer = null;
      var demoIndex = 0;
      var demoStopped = false;

      function startDemoLoop() {
        if (demoTimer !== null || demoStopped) return;
        demoTimer = setInterval(function () {
          addLine(DEMO_LINES[demoIndex % DEMO_LINES.length]);
          demoIndex++;
        }, demoSpeed);
      }

      function stopDemoLoop() {
        demoStopped = true;
        if (demoTimer !== null) {
          clearInterval(demoTimer);
          demoTimer = null;
        }
      }

      function ageMetrics(i) {
        // i = 0 for the newest line, increasing with age
        var opacity = Math.max(0.05, 1 - i * 0.19);
        var scale = Math.max(0.42, 1 - i * 0.15);
        var blur = Math.min(4.0, i * 0.55);
        var glow = Math.max(2, 22 - i * 3);
        return { opacity: opacity, scale: scale, blur: blur, glow: glow };
      }

      function glowShadow(px) {
        return [
          '0 0 ' + (px * 0.4) + 'px rgba(255,255,255,0.9)',
          '0 0 ' + px + 'px rgba(255,255,255,0.55)',
          '0 0 ' + (px * 2) + 'px rgba(255,255,255,0.25)'
        ].join(', ');
      }

      function applyAge(el, i, animate) {
        var m = ageMetrics(i);
        if (animate) {
          el.style.transition = 'transform .7s ease, opacity .6s ease, filter .6s ease, text-shadow .6s ease';
        }
        el.style.opacity = String(m.opacity);
        el.style.filter = 'blur(' + m.blur + 'px)';
        el.style.textShadow = glowShadow(m.glow);
        el.style.transform = 'translateY(0px) scale(' + m.scale + ')';
        el.dataset.scale = String(m.scale);
      }

      // 13x13 pixel line-art faces. '#' = lit pixel, '.' = empty.
      var FACE_BITMAPS = {
        happy: [
          '.....###.....',
          '...##...##...',
          '..#.......#..',
          '.#.........#.',
          '.#..#...#..#.',
          '#...........#',
          '#...........#',
          '#..#.....#..#',
          '.#..#...#..#.',
          '.#...###...#.',
          '..#.......#..',
          '...##...##...',
          '.....###.....'
        ],
        sad: [
          '.....###.....',
          '...##...##...',
          '..#.......#..',
          '.#...#.#...#.',
          '.#..#...#..#.',
          '#...........#',
          '#...........#',
          '#....###....#',
          '.#.##...##.#.',
          '.#.........#.',
          '..#.......#..',
          '...##...##...',
          '.....###.....'
        ]
      };

      function buildFace(mood) {
        var rows = FACE_BITMAPS[mood];
        if (!rows) return null;
        var svgNS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 13 13');
        svg.setAttribute('shape-rendering', 'crispEdges');
        svg.setAttribute('aria-hidden', 'true');
        svg.classList.add('line-face');
        for (var y = 0; y < rows.length; y++) {
          for (var x = 0; x < rows[y].length; x++) {
            if (rows[y].charAt(x) !== '#') continue;
            var r = document.createElementNS(svgNS, 'rect');
            r.setAttribute('x', x);
            r.setAttribute('y', y);
            r.setAttribute('width', '1');
            r.setAttribute('height', '1');
            r.setAttribute('fill', 'currentColor');
            svg.appendChild(r);
          }
        }
        return svg;
      }

      function addLine(text, mood) {
        text = (text || '').trim();
        if (!text) return;

        var existing = Array.prototype.slice.call(stack.children);
        var oldRects = existing.map(function (el) { return el.getBoundingClientRect(); });

        var el = document.createElement('div');
        el.className = 'line';
        var logo = document.createElement('img');
        logo.className = 'line-logo';
        logo.src = 'logo2.png';
        logo.alt = '';
        logo.draggable = false;
        var textSpan = document.createElement('span');
        textSpan.className = 'line-text';
        textSpan.textContent = text;
        el.appendChild(logo);
        el.appendChild(textSpan);
        if (mood) {
          var face = buildFace(mood);
          if (face) el.appendChild(face);
        }
        el.style.transition = 'none';
        el.style.opacity = '0';
        el.style.transform = 'translateY(24px) scale(0.92)';
        stack.appendChild(el);

        // prune overflow from the oldest end, animating them out
        var all = Array.prototype.slice.call(stack.children);
        while (all.length > MAX_LINES) {
          var oldest = all.shift();
          if (oldest === el) continue;
          oldest.style.transition = 'opacity .5s ease, transform .5s ease';
          oldest.style.opacity = '0';
          oldest.style.transform = 'translateY(-18px) scale(0.3)';
          (function (node) {
            setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 520);
          })(oldest);
        }

        requestAnimationFrame(function () {
          // FLIP: invert — snap previously-existing lines back to their old
          // screen position now that the new line has shifted the layout.
          existing.forEach(function (line, idx) {
            if (!line.isConnected) return;
            var oldRect = oldRects[idx];
            var newRect = line.getBoundingClientRect();
            var delta = oldRect.top - newRect.top;
            var scale = parseFloat(line.dataset.scale || '1');
            line.style.transition = 'none';
            line.style.transform = 'translateY(' + delta + 'px) scale(' + scale + ')';
          });

          requestAnimationFrame(function () {
            // play — relax everything to its resting position/age styling
            var visible = Array.prototype.slice.call(stack.children).filter(function (n) { return n.isConnected; });
            var total = visible.length;
            visible.forEach(function (line, idx) {
              var ageIndex = total - 1 - idx; // newest (last child) = 0
              applyAge(line, ageIndex, true);
            });
          });
        });
      }

      function connect() {
        var es = new EventSource('/stream');
        var gotRealMessage = false;

        es.addEventListener('hand', function (e) {
          if (window.__onLyricHandEvent) window.__onLyricHandEvent(e);
        });

        es.onmessage = function (e) {
          if (!gotRealMessage) {
            gotRealMessage = true;
            stopDemoLoop();
          }
          setStatus('live');
          var text = e.data;
          var mood = null;
          try {
            var obj = JSON.parse(e.data);
            if (obj && typeof obj.text === 'string') {
              text = obj.text;
              mood = obj.mood || null;
              // obj.stage 也可用，本次不显示，留作后续暴露层接口
            }
          } catch (err) { /* 纯文本帧，按原样处理 */ }
          addLine(text, mood);
        };
        es.onopen = function () {
          setStatus(gotRealMessage ? 'live' : 'connected');
        };
        es.onerror = function () {
          // EventSource retries automatically; leave the screen as-is.
          setStatus('reconnecting…');
        };

        if (isDebug) {
          setTimeout(function () {
            if (!gotRealMessage) {
              setStatus('demo (no input)');
              startDemoLoop();
            }
          }, 4000);
        }
      }

      if (isDemo) {
        startDemoLoop();
      } else {
        // default (no params) and ?debug=1 both start from live /stream only;
        // ?debug=1 additionally falls back to the demo loop after a quiet period.
        connect();
      }
    })();
  </script>

  <div id="crt-overlay" aria-hidden="true">
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
    <div class="crt-rgbsplit"></div>
    <div class="crt-rollbar"></div>
  </div>
</body>
</html>
